# Tier 0: Single Black Hole Verification with Damping Gauge Feedback Loop
# Maps to Chapter 4 Verification Test 1, 6, and 7
Evolution:
  InitialTime: 0.0
  InitialTimeStep: 0.01
  TimeStepper:
    AdamsBashforth:
      Order: 4

PhaseChangeAndTriggers:
  - Trigger:
      Slabs:
        EvenlySpaced:
          Interval: 10
          Offset: 0
    PhaseChanges:
      - EvaluateDampingGaugeFeedback

DomainCreator:
  Sphere:
    InnerRadius: 0.792
    OuterRadius: 600.0
    Interior:
      ExciseWithBoundaryCondition: DirichletAnalytic
    InitialRefinement: 1
    InitialGridPoints: [5, 5, 5]

GeneralizedHarmonic:
  GaugeCondition:
    RollOnStartTime: 0.0
    RollOnTimeWindow: 10.0
    SpatialDecayWidth: 17.13
    Amplitudes: [1.0, 1.0, 0.0]
    Exponents: [2, 2, 2]
  ConstraintDamping:
    Amplitudes: [0.1, 1.0, -1.0]

ControlSystems:
  DampingGaugeFeedback:
    TimeConstant: 395.0
    MaxScaleFactor: 3.0
    ConstraintThreshold: 1.0e-8
